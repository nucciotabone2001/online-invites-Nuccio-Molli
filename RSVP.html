<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="RSVP.css">
  <script src="RSVP.js" defer></script>
  <link rel="stylesheet" href="https://use.typekit.net/hjz0ooj.css">
  <link rel="stylesheet" href="https://use.typekit.net/qei0ryy.css">


  <title>RSVP – Nuccio & Monica</title>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyA4HO8iZteCJaMiYr2XXm7-soUGztwiCc4",
  authDomain: "inviti-matrimonio.firebaseapp.com",
  projectId: "inviti-matrimonio",
  storageBucket: "inviti-matrimonio.firebasestorage.app",
  messagingSenderId: "990397184013",
  appId: "1:990397184013:web:1e322d256f20b1a9ba3d44",
  measurementId: "G-EC9ZLW37HT"
};

  const app = initializeApp(firebaseConfig);
  window.db = getFirestore(app);
  window.addDoc = addDoc;
  window.collection = collection;
</script>

</script>

</head>


<body>


<section id="rsvp-section">
  <div class="rsvp-card">
    <h2>RSVP</h2>
    <p class="rsvp-note">
      Conferma la tua presenza entro il <strong>1 Aprile 2026</strong>.
    </p>


    <form
      id="rsvp-form"
      method="POST"
      action="https://script.google.com/macros/s/AKfycbyVS-JHbKrUkkJ5q7khBWWBNw_EsDtxTuNEvB-nYW8flOR9ytWO5jwPVxUFJ5H1cwUo/exec"
      target="hidden-iframe" 
    >


      <!-- Nome -->
      <label>Nome e cognome</label>
      <input
        type="text"
        id="main-name"
        name="Nome e cognome"
        required
      >


      <!-- Presenza -->
      <label>Confermi la tua presenza?</label>
      <div class="yesno-wrapper">
        <button type="button" class="yesno-btn" data-value="Si">Sì, ci sarò</button>
        <button type="button" class="yesno-btn" data-value="No">No, non potrò partecipare</button>
      </div>


      <input type="hidden" id="presence-value" name="Parteciperai?">


      <p id="no-message" class="hidden no-msg">
        Grazie per averci avvisati.
        Ci dispiace che tu non possa essere con noi, ma ti abbracciamo forte.
      </p>


      <div id="rsvp-extra-fields">


        <!-- Allergie principale -->
        <label>Hai allergie o intolleranze?</label>
        <div class="yesno-allergy">
          <label>
            <input type="radio" name="Allergie ospite principale?" value="Si" id="allergy-yes">
            <span>Sì</span>
          </label>
          <label>
            <input type="radio" name="Allergie ospite principale?" value="No" id="allergy-no" checked>
            <span>No</span>
          </label>
        </div>


        <textarea
          id="main-allergy-text"
          name="Allergie ospite principale"
          class="hidden"
          placeholder="Indica quali"
        ></textarea>


        <!-- Numero ospiti extra -->
        <label>Stai confermando anche per qualcun altro? Quanti?</label>
        <input
          type="number"
          id="guest-count"
          name="Numero ospiti extra"
          min="0"
          max="10"
          value="0"
        >


        <!-- Campi dinamici -->
        <div id="guest-fields"></div>


        <!-- Campi aggregati -->
        <textarea id="all-extra-names" name="Nomi ospiti extra" class="hidden"></textarea>
        <textarea id="all-extra-allergies" name="Allergie ospiti extra" class="hidden"></textarea>


        <!-- Messaggio -->
        <label>Messaggio per gli sposi (opzionale)</label>
        <textarea id="message" name="Messaggio per gli sposi" rows="3"></textarea>


      </div>


      <div class="rsvp-actions">
        <button type="submit" id="submit-btn" class="rsvp-submit">Invia RSVP</button>
        <button type="button" class="rsvp-back" onclick="history.back()">Indietro</button>
      </div>


    </form>
    <iframe name="hidden-iframe" style="display:none;"></iframe>
  </div>
</section>


</body>
</html>
